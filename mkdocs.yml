site_name: R9700 ×4 Build Book
site_description: Four Radeon AI PRO R9700 32 GB on a WRX90 workstation — priced builds, part dossiers and the decisions behind them.
site_author: Aperture Build Book
site_url: https://ggrabarz.github.io/r9700-quad/
repo_url: https://github.com/ggrabarz/r9700-quad
repo_name: ggrabarz/r9700-quad
docs_dir: site-src/docs
site_dir: site
use_directory_urls: true

exclude_docs: |

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to soft light
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    logo: material/server
    repo: material/book-open-variant

extra_css:
  - assets/stylesheets/space.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - site-src/docs
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - The build: build.md
  - Parts wiki:
      - Overview: parts/index.md
      - GPU:
          - Radeon AI PRO R9700: parts/radeon-r9700.md
      - Storage:
          - Samsung 9100 PRO: parts/samsung-9100-pro.md
  - Reference:
      - Platform verdict (superseded): reference/epyc-platform.md
      - Memory ladder: reference/memory-ladder.md
      - Power connectors: reference/power-connectors.md
      - Storage & lanes: reference/storage-lanes.md
      - Acceptance protocol: reference/validation.md
      - Sources: reference/sources.md
